<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185b42" />
    <meta
      name="description"
      content="Protótipo do E-Coleta para a disciplina de Interação Humano-Computador da UFSCar."
    />
    <title>Lote registrado · E-Coleta</title>
    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="../../src/styles.css" />
    <script type="module" src="../../src/pages/triagem.js"></script>
  </head>
  <body data-pagina="triagem-concluida">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div class="aplicacao profissional">
      <header class="cabecalho">
        <span class="marca">E-Coleta Profissional</span>
        <a class="acessibilidade" href="../../pages/acessibilidade/index.html" id="acessibilidade">
          <svg
            class="icone"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="4" r="2" />
            <path d="m4 8 8 2 8-2M12 10v5m0 0-4 7m4-7 4 7" />
          </svg>
          Acessibilidade
        </a>
      </header>
      <main id="conteudo">
        <h1>Lote registrado</h1>
        <p class="introducao">Entrada finalizada com sucesso.</p>
        <div class="conteudo">
          <div class="cartao conclusao">
            <h2>CONCLUÍDO</h2>
            <h2 class="espaco">
              Lote
              <span id="lote-id">EC-024</span>
            </h2>
            <p>
              <span id="quantidade-categorias">3</span>
              categorias registradas
            </p>
          </div>
          <div class="cartao">
            <h2>Materiais registrados</h2>
            <p id="itens">Notebook · Celular · Cabos</p>
            <p>Situação: triagem concluída</p>
          </div>
        </div>
        <div class="acoes"><a class="botao secundario" href="index.html">Voltar aos lotes</a></div>
      </main>
      <footer class="rodape">
        <a class="voltar-menu" href="../../index.html">Menu dos fluxos</a>
      </footer>
    </div>
    <div id="mensagem" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
