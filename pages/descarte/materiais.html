<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185b42" />
    <meta
      name="description"
      content="Protótipo do E-Coleta para a disciplina de Interação Humano-Computador da UFSCar."
    />
    <title>O que você quer descartar? · E-Coleta</title>
    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="../../src/styles.css" />
    <script type="module" src="../../src/pages/descarte.js"></script>
  </head>
  <body data-pagina="descarte-materiais">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div class="aplicacao">
      <header class="cabecalho">
        <span class="marca">E-Coleta</span>
        <a class="acessibilidade" href="../../pages/acessibilidade/index.html" id="acessibilidade">
          <svg
            class="icone"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="4" r="2" />
            <path d="m4 8 8 2 8-2M12 10v5m0 0-4 7m4-7 4 7" />
          </svg>
          Acessibilidade
        </a>
      </header>
      <main id="conteudo">
        <h1>O que você quer descartar?</h1>
        <p class="introducao">Selecione os tipos de material.</p>
        <div class="conteudo">
          <form id="busca" class="pilha" action="pontos.html" novalidate>
            <fieldset>
              <div class="opcoes-materiais">
                <label class="material">
                  <input type="checkbox" name="materiais" value="notebook" checked />
                  <span>
                    <svg class="check" viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="m5 12 4 4L19 6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                      />
                    </svg>
                    Notebook
                  </span>
                </label>
                <label class="material">
                  <input type="checkbox" name="materiais" value="celular" checked />
                  <span>
                    <svg class="check" viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="m5 12 4 4L19 6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                      />
                    </svg>
                    Celular
                  </span>
                </label>
                <label class="material">
                  <input type="checkbox" name="materiais" value="cabos" checked />
                  <span>
                    <svg class="check" viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="m5 12 4 4L19 6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                      />
                    </svg>
                    Cabos
                  </span>
                </label>
              </div>
              <p class="erro-campo" id="erro-materiais" hidden></p>
            </fieldset>
            <div class="campo">
              <label for="localizacao">Localização</label>
              <input id="localizacao" name="localizacao" value="São Carlos · perto do campus" />
            </div>
            <button class="link-discreto" type="button" data-acao="localizar">
              Usar minha localização
            </button>
          </form>
        </div>
        <div class="acoes">
          <button class="botao" type="submit" form="busca">Buscar pontos próximos</button>
        </div>
      </main>
      <footer class="rodape">
        <a class="voltar-menu" href="../../index.html">Menu dos fluxos</a>
      </footer>
    </div>
    <div id="mensagem" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
