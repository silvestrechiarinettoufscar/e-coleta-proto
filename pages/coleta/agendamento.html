<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185b42" />
    <meta
      name="description"
      content="Protótipo do E-Coleta para a disciplina de Interação Humano-Computador da UFSCar."
    />
    <title>Coleta de Beatriz · E-Coleta</title>
    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="../../src/styles.css" />
    <script type="module" src="../../src/pages/coleta.js"></script>
  </head>
  <body data-pagina="coleta-agendamento">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div class="aplicacao profissional">
      <header class="cabecalho">
        <span class="marca">E-Coleta Profissional</span>
        <a class="acessibilidade" href="../../pages/acessibilidade/index.html" id="acessibilidade">
          <svg
            class="icone"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="4" r="2" />
            <path d="m4 8 8 2 8-2M12 10v5m0 0-4 7m4-7 4 7" />
          </svg>
          Acessibilidade
        </a>
      </header>
      <main id="conteudo">
        <h1>Coleta de Beatriz</h1>
        <p class="introducao">
          Retirada prevista para
          <span id="horario">9h às 10h</span>
          .
        </p>
        <div class="conteudo">
          <div class="cartao">
            <h2>Endereço</h2>
            <p id="endereco">Rua de exemplo, 80</p>
            <p>São Carlos</p>
          </div>
          <div class="cartao">
            <h2>Itens informados</h2>
            <p id="itens">Notebook · Celular · Cabos</p>
            <p>
              Volume previsto:
              <span id="volume">1 caixa</span>
            </p>
          </div>
        </div>
        <div class="acoes">
          <button type="button" class="botao" id="confirmar">Confirmar agendamento</button>
        </div>
      </main>
      <footer class="rodape">
        <a class="voltar-menu" href="../../index.html">Menu dos fluxos</a>
      </footer>
    </div>
    <div id="mensagem" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
