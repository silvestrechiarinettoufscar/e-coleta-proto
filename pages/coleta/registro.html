<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185b42" />
    <meta
      name="description"
      content="Protótipo do E-Coleta para a disciplina de Interação Humano-Computador da UFSCar."
    />
    <title>Registrar coleta · E-Coleta</title>
    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="../../src/styles.css" />
    <script type="module" src="../../src/pages/coleta.js"></script>
  </head>
  <body data-pagina="coleta-registro">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div class="aplicacao profissional">
      <header class="cabecalho">
        <span class="marca">E-Coleta Profissional</span>
        <a class="acessibilidade" href="../../pages/acessibilidade/index.html" id="acessibilidade">
          <svg
            class="icone"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="4" r="2" />
            <path d="m4 8 8 2 8-2M12 10v5m0 0-4 7m4-7 4 7" />
          </svg>
          Acessibilidade
        </a>
      </header>
      <main id="conteudo">
        <h1>Registrar coleta</h1>
        <p class="introducao">Confira os materiais recolhidos.</p>
        <div class="conteudo">
          <div class="cartao">
            <h2>Itens recolhidos</h2>
            <p id="itens">Notebook · Celular · Cabos</p>
          </div>
          <form id="registro-coleta" class="pilha" action="concluida.html" novalidate>
            <div class="campo">
              <label for="faixa">Faixa de peso estimada</label>
              <select id="faixa" name="faixa">
                <option>Até 5 kg</option>
                <option>De 5 a 10 kg</option>
                <option>Acima de 10 kg</option>
              </select>
              <span class="erro-campo" id="erro-faixa" hidden></span>
            </div>
            <input type="file" id="foto" accept="image/*" capture="environment" hidden />
            <button type="button" class="botao secundario" id="capturar-foto" data-acao="foto">
              Capturar foto
            </button>
            <p id="foto-status" class="texto-verde" hidden>✓ Foto do lote anexada</p>
          </form>
        </div>
        <div class="acoes">
          <button class="botao" type="submit" form="registro-coleta">Concluir coleta</button>
        </div>
      </main>
      <footer class="rodape">
        <a class="voltar-menu" href="../../index.html">Menu dos fluxos</a>
      </footer>
    </div>
    <div id="mensagem" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
