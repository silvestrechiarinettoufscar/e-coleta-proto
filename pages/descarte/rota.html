<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185b42" />
    <meta
      name="description"
      content="Protótipo do E-Coleta para a disciplina de Interação Humano-Computador da UFSCar."
    />
    <title>Rota a pé · E-Coleta</title>
    <link rel="icon" href="/images/favicon.svg" />
    <link rel="stylesheet" href="../../src/styles.css" />
    <script type="module" src="../../src/pages/descarte.js"></script>
  </head>
  <body data-pagina="descarte-rota">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div class="aplicacao">
      <header class="cabecalho">
        <span class="marca">E-Coleta</span>
        <a class="acessibilidade" href="../../pages/acessibilidade/index.html" id="acessibilidade">
          <svg
            class="icone"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="4" r="2" />
            <path d="m4 8 8 2 8-2M12 10v5m0 0-4 7m4-7 4 7" />
          </svg>
          Acessibilidade
        </a>
      </header>
      <main id="conteudo">
        <h1>Rota a pé</h1>
        <p class="introducao">
          Até o
          <span id="nome-ponto">Ponto Campus</span>
          .
        </p>
        <div class="conteudo">
          <div class="mapa">
            <img src="/images/mapa.svg" alt="Mapa esquemático da rota" />
            <p class="mapa-legenda">Mapa esquemático</p>
          </div>
          <div class="cartao">
            <h2>
              <span id="distancia">650 m</span>
              · cerca de
              <span id="minutos">9</span>
              min
            </h2>
            <p>
              Destino:
              <span id="endereco">Rua de exemplo, 100</span>
            </p>
          </div>
        </div>
        <div class="acoes"><a class="botao secundario" href="index.html">Voltar ao início</a></div>
      </main>
      <footer class="rodape">
        <a class="voltar-menu" href="../../index.html">Menu dos fluxos</a>
      </footer>
    </div>
    <div id="mensagem" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
